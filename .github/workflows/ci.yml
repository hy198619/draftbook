name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Swift tests
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify Xcode toolchain
        run: xcodebuild -version

      - name: Run tests
        run: swift test
