name: Windows CI

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/windows-ci.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test tests/DraftBook.Core.Tests/DraftBook.Core.Tests.csproj -c Release
      - run: dotnet test tests/DraftBook.Windows.Tests/DraftBook.Windows.Tests.csproj -c Release

  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            runner: windows-2025
          - runtime: win-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Build installer and update package
        shell: pwsh
        run: ./scripts/publish-windows.ps1 -Runtime ${{ matrix.runtime }} -SkipTests
      - name: Read package identity
        id: package
        shell: pwsh
        run: |
          $version = (dotnet msbuild src/DraftBook.Windows/DraftBook.Windows.csproj -getProperty:Version).Trim()
          $name = "DraftBook-Windows-$version-${{ matrix.runtime }}-installer"
          "name=$name" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: windows/artifacts/releases/${{ matrix.runtime }}/**
          if-no-files-found: error
